services:
  minio:
    image: minio/minio
    container_name: ticket-master-minio
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost:9000/minio/health/live || exit 1
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:17
    container_name: ticket-master-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:latest
    container_name: ticket-master-nginx
    ports:
      - "8080:80"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -f http://localhost || exit 1
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s

volumes:
  minio-data:
    driver: local
  postgres-data:
    driver: local
